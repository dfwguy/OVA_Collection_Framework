<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc"><title id="title">OVA Collection Framework architecture</title><desc id="desc">Slurm, durable run artifacts and runner manifests feed bounded asynchronous collectors. Persistent SQLite checkpoints and immutable hashes publish Parquet generations for a DuckDB browser and verified exports. Systemd restarts collection at boot; retained sources permit replay. Hub transfer is separately authorized.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#76b900"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#90999b"/></marker></defs><rect width="1600" height="1150" rx="18" fill="#101414"/><rect width="1600" height="8" fill="#76b900"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="56" font-size="23" fill="#76b900" font-weight="700" letter-spacing="4">NVIDIA</text><text x="48" y="107" font-size="38" fill="#fff" font-weight="700">OVA Collection Framework</text><text x="48" y="143" font-size="20" fill="#bac4c3">From the first scoped validation job to a verified cluster handover</text><rect x="35" y="180" width="360" height="690" rx="14" fill="#171e1e" stroke="#3a4644"/><text x="55" y="216" font-size="18" font-weight="700" fill="#76b900">01  CLUSTER SOURCES</text><rect x="55" y="245" width="320" height="122" rx="9" fill="#222d2b" stroke="#344541"/><text x="71" y="273" font-size="16" font-weight="700" fill="#fff">Slurm controller</text><text x="71" y="299" font-size="15" fill="#c7d1cf">Live job / allocation metadata</text><text x="71" y="322" font-size="15" fill="#c7d1cf">Submitted scripts while retained</text><text x="71" y="345" font-size="15" fill="#c7d1cf">Native jobcomp/filetxt terminal feed</text><rect x="55" y="390" width="320" height="100" rx="9" fill="#222d2b" stroke="#344541"/><text x="71" y="418" font-size="16" font-weight="700" fill="#fff">Existing accounting (optional)</text><text x="71" y="444" font-size="15" fill="#c7d1cf">sacct JSON · job / step evidence</text><text x="71" y="467" font-size="15" fill="#c7d1cf">Retained history for outage replay</text><rect x="55" y="515" width="320" height="145" rx="9" fill="#222d2b" stroke="#344541"/><text x="71" y="543" font-size="16" font-weight="700" fill="#fff">Durable validation artifacts</text><text x="71" y="569" font-size="15" fill="#c7d1cf">stdout / stderr / per-rank logs</text><text x="71" y="592" font-size="15" fill="#c7d1cf">Submitted scripts and actual config</text><text x="71" y="615" font-size="15" fill="#c7d1cf">PASS / FAIL / CANCEL / retry evidence</text><text x="71" y="638" font-size="15" fill="#c7d1cf">Shared storage preferred for reboot</text><rect x="55" y="685" width="320" height="125" rx="9" fill="#222d2b" stroke="#344541"/><text x="71" y="713" font-size="16" font-weight="700" fill="#fff">Runner &amp; agent lifecycle</text><text x="71" y="739" font-size="15" fill="#c7d1cf">submit.py → actual job ID</text><text x="71" y="762" font-size="15" fill="#c7d1cf">Trusted exact-path manifest</text><text x="71" y="785" font-size="15" fill="#c7d1cf">Cluster + epoch + job association</text><rect x="430" y="180" width="340" height="690" rx="14" fill="#171e1e" stroke="#3a4644"/><text x="450" y="216" font-size="18" font-weight="700" fill="#76b900">02  ASYNCHRONOUS CAPTURE</text><rect x="450" y="245" width="300" height="122" rx="9" fill="#222d2b" stroke="#344541"/><text x="466" y="273" font-size="16" font-weight="700" fill="#fff">Metadata &amp; terminal discovery</text><text x="466" y="299" font-size="15" fill="#c7d1cf">15 s after prior metadata pass</text><text x="466" y="322" font-size="15" fill="#c7d1cf">Checkpointed accounting windows</text><text x="466" y="345" font-size="15" fill="#c7d1cf">Independent of node SSH reads</text><rect x="450" y="420" width="300" height="145" rx="9" fill="#222d2b" stroke="#344541"/><text x="466" y="448" font-size="16" font-weight="700" fill="#fff">Local / remote artifact readers</text><text x="466" y="474" font-size="15" fill="#c7d1cf">Fair persistent job / host queue</text><text x="466" y="497" font-size="15" fill="#c7d1cf">Allowlisted roots · strict SSH trust</text><text x="466" y="520" font-size="15" fill="#c7d1cf">8 hosts / pass · 2 readers / service</text><text x="466" y="543" font-size="15" fill="#c7d1cf">Errors and deferrals stay visible</text><rect x="450" y="635" width="300" height="175" rx="9" fill="#222d2b" stroke="#344541"/><text x="466" y="663" font-size="16" font-weight="700" fill="#fff">Boot &amp; restart supervision</text><text x="466" y="689" font-size="15" fill="#c7d1cf">13 systemd service / timer units</text><text x="466" y="712" font-size="15" fill="#c7d1cf">Mount dependency · retry on failure</text><text x="466" y="735" font-size="15" fill="#c7d1cf">Fixed-unit availability watchdog</text><text x="466" y="758" font-size="15" fill="#c7d1cf">CPU / memory / IO budgets</text><text x="466" y="781" font-size="15" fill="#c7d1cf">No workload-dependent upload</text><rect x="805" y="180" width="355" height="690" rx="14" fill="#171e1e" stroke="#3a4644"/><text x="825" y="216" font-size="18" font-weight="700" fill="#76b900">03  PERSISTENT EVIDENCE LAKE</text><rect x="825" y="245" width="315" height="122" rx="9" fill="#222d2b" stroke="#344541"/><text x="841" y="273" font-size="16" font-weight="700" fill="#fff">SQLite WAL checkpoint</text><text x="841" y="299" font-size="15" fill="#c7d1cf">Job / source inventory and cursors</text><text x="841" y="322" font-size="15" fill="#c7d1cf">Restart recovery and capture journal</text><text x="841" y="345" font-size="15" fill="#c7d1cf">One cluster / epoch per lake</text><rect x="825" y="405" width="315" height="145" rx="9" fill="#222d2b" stroke="#344541"/><text x="841" y="433" font-size="16" font-weight="700" fill="#fff">Immutable raw versions</text><text x="841" y="459" font-size="15" fill="#c7d1cf">Original + stored SHA-256</text><text x="841" y="482" font-size="15" fill="#c7d1cf">Redaction provenance kept</text><text x="841" y="505" font-size="15" fill="#c7d1cf">Durable atomic writes / directory sync</text><text x="841" y="528" font-size="15" fill="#c7d1cf">No silent deletion on low disk</text><rect x="825" y="590" width="315" height="145" rx="9" fill="#222d2b" stroke="#344541"/><text x="841" y="618" font-size="16" font-weight="700" fill="#fff">Apache Parquet generations</text><text x="841" y="644" font-size="15" fill="#c7d1cf">Jobs · artifacts · validation · metrics</text><text x="841" y="667" font-size="15" fill="#c7d1cf">Coverage / gaps / errors tables</text><text x="841" y="690" font-size="15" fill="#c7d1cf">Content-addressed binary chunks</text><text x="841" y="713" font-size="15" fill="#c7d1cf">Atomic current-generation switch</text><rect x="825" y="760" width="315" height="70" rx="9" fill="#222d2b" stroke="#344541"/><text x="841" y="788" font-size="16" font-weight="700" fill="#fff">Rebuildable full-text index</text><rect x="1195" y="180" width="370" height="690" rx="14" fill="#171e1e" stroke="#3a4644"/><text x="1215" y="216" font-size="18" font-weight="700" fill="#76b900">04  EXPLORE &amp; HAND OVER</text><rect x="1215" y="245" width="330" height="145" rx="9" fill="#222d2b" stroke="#344541"/><text x="1231" y="273" font-size="16" font-weight="700" fill="#fff">Authenticated DuckDB browser</text><text x="1231" y="299" font-size="15" fill="#c7d1cf">Loopback · SSH tunnel / TLS SSO</text><text x="1231" y="322" font-size="15" fill="#c7d1cf">Token login + signed session</text><text x="1231" y="345" font-size="15" fill="#c7d1cf">Read-only SQL · bounded queries</text><text x="1231" y="368" font-size="15" fill="#c7d1cf">Logs, coverage and export downloads</text><rect x="1215" y="435" width="330" height="145" rx="9" fill="#222d2b" stroke="#344541"/><text x="1231" y="463" font-size="16" font-weight="700" fill="#fff">Verified portable export</text><text x="1231" y="489" font-size="15" fill="#c7d1cf">Pinned Parquet snapshot + payloads</text><text x="1231" y="512" font-size="15" fill="#c7d1cf">Archive checksum + schema identity</text><text x="1231" y="535" font-size="15" fill="#c7d1cf">Independent raw reconstruction</text><text x="1231" y="558" font-size="15" fill="#c7d1cf">No collector / SQLite dependency</text><rect x="1215" y="640" width="330" height="145" rx="9" fill="#222d2b" stroke="#344541"/><text x="1231" y="668" font-size="16" font-weight="700" fill="#fff">Validation hub / future reference</text><text x="1231" y="694" font-size="15" fill="#c7d1cf">Authorized transfer + import receipt</text><text x="1231" y="717" font-size="15" fill="#c7d1cf">Tenant / cluster / epoch isolation</text><text x="1231" y="740" font-size="15" fill="#c7d1cf">Idempotent artifact version / hash</text><text x="1231" y="763" font-size="15" fill="#c7d1cf">Compatible workload comparisons</text><polyline points="375,305 450,305" fill="none" stroke="#76b900" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="375,440 410,440 410,355 450,355" fill="none" stroke="#76b900" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="375,587 450,487" fill="none" stroke="#76b900" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="375,745 410,745 410,545 450,545" fill="none" stroke="#76b900" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="750,305 825,305" fill="none" stroke="#76b900" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="750,487 825,477" fill="none" stroke="#76b900" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="982,367 982,405" fill="none" stroke="#76b900" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="982,550 982,590" fill="none" stroke="#76b900" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="982,735 982,760" fill="none" stroke="#76b900" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="1140,651 1177,651 1177,318 1215,318" fill="none" stroke="#76b900" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="1140,693 1190,693 1190,508 1215,508" fill="none" stroke="#76b900" stroke-width="2"  marker-end="url(#arrow)"/><polyline points="1380,580 1380,640" fill="none" stroke="#76b900" stroke-width="2"  marker-end="url(#arrow)"/><text x="1390" y="614" font-size="14" fill="#bbc8c4">Authorized delivery</text><polyline points="1140,795 1183,795 1183,360 1215,360" fill="none" stroke="#90999b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#gray)"/><rect x="35" y="905" width="1530" height="200" rx="14" fill="#1d2722" stroke="#76b900"/><text x="58" y="940" font-size="20" font-weight="700" fill="#76b900">CAPTURE CONTRACT &amp; TRUST BOUNDARIES</text><text x="58" y="977" font-size="17" fill="#e0e7e2">Arm durable terminal feeds and registered artifact retention before job 1. Preserve failures, retries, missing sources and original provenance.</text><text x="58" y="1010" font-size="17" fill="#e0e7e2">Recovery uses retained sources and persistent checkpoints. Host downtime pauses collection; deleted bytes and unavailable sources remain explicit gaps.</text><text x="58" y="1043" font-size="17" fill="#e0e7e2">Scheduler execution stays independent. No synchronous Python / network / Parquet hook; dedicated collector and bounded low-priority reads.</text><text x="58" y="1076" font-size="16" fill="#b5c4bb">Portable source bundle excludes customer data. Reboot survival, coverage, large-file adapters and overhead require target acceptance.</text></g></svg>