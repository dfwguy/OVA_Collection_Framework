<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320" role="img" aria-labelledby="title desc">
  <title id="title">NVIDIA OVA Collection Framework</title>
  <desc id="desc">Three evidence streams converge into a layered columnar data lake. A pipeline connects Slurm, raw evidence, Apache Parquet, DuckDB and verified handover.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101917"/>
      <stop offset="1" stop-color="#080c0b"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="1" stop-color="#b0df49"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="320" rx="18" fill="url(#background)"/>
  <path d="M0 300H1440" stroke="#76b900" stroke-width="3"/>
  <g fill="none" stroke="#21453c" stroke-width="1" opacity=".6">
    <path d="M1160 0V245M1210 0V245M1260 0V245M1310 0V245M1360 0V245M1410 0V245"/>
    <path d="M1120 45H1440M1120 95H1440M1120 145H1440M1120 195H1440M1120 245H1440"/>
  </g>
  <!-- Collection mark: incoming evidence streams and a columnar lake. -->
  <circle cx="158" cy="145" r="112" fill="#13251f" stroke="#2b4c3e"/>
  <g stroke="#5dbdb0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 67V90Q78 100 90 100H143Q158 100 158 118"/>
    <path d="M158 55V118"/>
    <path d="M238 67V90Q238 100 226 100H173Q158 100 158 118"/>
  </g>
  <g fill="#10221d" stroke="#7dd7c6" stroke-width="4">
    <circle cx="78" cy="64" r="12"/>
    <circle cx="158" cy="52" r="12"/>
    <circle cx="238" cy="64" r="12"/>
  </g>
  <path d="M149 109L158 120L167 109" fill="none" stroke="#76b900" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M90 137V213C90 238 226 238 226 213V137Z" fill="url(#lake)"/>
  <ellipse cx="158" cy="137" rx="68" ry="20" fill="#b0df49" stroke="#c5ed7d" stroke-width="2"/>
  <ellipse cx="158" cy="137" rx="45" ry="11" fill="#456f11"/>
  <g stroke="#31590c" stroke-width="3" fill="none">
    <path d="M91 166C104 189 212 189 225 166"/>
    <path d="M91 193C104 216 212 216 225 193"/>
  </g>
  <g fill="#16351e">
    <rect x="124" y="156" width="14" height="14" rx="2"/>
    <rect x="151" y="160" width="14" height="14" rx="2"/>
    <rect x="178" y="156" width="14" height="14" rx="2"/>
    <rect x="124" y="184" width="14" height="13" rx="2"/>
    <rect x="151" y="188" width="14" height="13" rx="2"/>
    <rect x="178" y="184" width="14" height="13" rx="2"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="310" y="63" font-size="23" font-weight="700" letter-spacing="5" fill="#76b900">NVIDIA</text>
    <text x="310" y="126" font-size="47" font-weight="700" fill="#fff">OVA Collection Framework</text>
    <text x="310" y="173" font-size="23" fill="#d7e4df">Every validation attempt. One persistent evidence lake.</text>
    <text x="310" y="210" font-size="17" fill="#91a99d">CAPTURE  ·  PRESERVE  ·  EXPLORE  ·  EXPORT</text>
    <path d="M340 264H1290" stroke="#315045" stroke-width="2"/>
    <g fill="#76b900">
      <circle cx="340" cy="264" r="5"/><circle cx="560" cy="264" r="5"/><circle cx="800" cy="264" r="5"/><circle cx="1040" cy="264" r="5"/><circle cx="1290" cy="264" r="5"/>
    </g>
    <g fill="#d9e8df" font-size="16" font-weight="700" text-anchor="middle">
      <text x="340" y="288">SLURM</text><text x="560" y="288">RAW EVIDENCE</text><text x="800" y="288">APACHE PARQUET</text><text x="1040" y="288">DUCKDB</text><text x="1290" y="288">HANDOVER</text>
    </g>
  </g>
</svg>
